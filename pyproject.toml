[project]
name = "liza"
version = "0.0.1"
description = "A code assistant driven by a local model, scoped to small Python tasks"
readme = "README.md"
license = { text = "MIT" }
# 3.10 rather than 3.11 — see docs/adr/0005-development-environment.md.
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
]

[project.scripts]
liza-stub = "liza.stub:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/liza"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The suite never calls a model and never needs a network peer beyond loopback.
# If a test starts hanging, it is a bug in the test, not a slow model.
addopts = "-q --strict-markers"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
